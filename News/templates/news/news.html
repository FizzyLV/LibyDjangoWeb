{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBY - News</title>
    <link rel="stylesheet" href="{% static 'News/css/news.css' %}">
</head>
<body>
    <h1>Latest News</h1>
    {% include 'components/navbar.html' %}
        <div id="news-list">
            {% for item in news %}
                <div>
                    <div class="image-container">
                        {% if item.image %}
                            <img src="{{ item.image.url }}" alt="{{ item.title }}">
                        {% endif %}
                    </div>
                    <div class="news-details">
                        <h3>{{ item.author.firstName }} {{ item.author.lastName }}</h3>
                        <h4>{{ item.title }}</h4>
                        <p>Published on: {{ item.publishedAt }}</p>
                    </div>
                </div>
            {% endfor %}



   <script>
       // Connect to SSE endpoint
       const eventSource = new EventSource('/events/news');
       
       eventSource.addEventListener('new_news', function(e) {
           const data = JSON.parse(e.data);
           console.log('New news received:', data);
           
           
           addNewsItemToPage(data);
       });
       
       function addNewsItemToPage(newsItem) {
          
           const newsHTML = `
               <div data-news-id="${newsItem.id}">
                   <h3>${newsItem.authorName}</h3>
                   <h4>${newsItem.title}</h4>
                   <p>${newsItem.description}</p>
                   <p>Published on: ${new Date(newsItem.publishedAt * 1000).toLocaleString()}</p>
                   ${newsItem.imageUrl ? `<img src="${newsItem.imageUrl}" style="max-width: 200px; height: 200px;">` : ''}
               </div>
               <hr>
           `;
           
           // Prepend to news list
           document.getElementById('news-list').insertAdjacentHTML('afterbegin', newsHTML);
       }
       
       eventSource.onerror = function(e) {
           console.error('SSE Error:', e);
       };
   </script>
</body>
</html>
